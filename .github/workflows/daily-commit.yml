name: Daily Contribution Automator

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update text file
        run: |
          echo "Last updated on $(date -u)" > activity.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "donaldzrbeats"
          git config --global user.email "donaldzrbeats@gmail.com"
          git add activity.txt
          git commit -m "chore: automated daily contribution"
          git push
